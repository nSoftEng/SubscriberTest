version: '3.8'

services:
  sales-tax:
    build: .
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
