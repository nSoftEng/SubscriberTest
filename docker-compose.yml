services:
  sales-tax:
    build: .
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:0.6b
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "qwen3:0.6b"]

volumes:
  ollama:
